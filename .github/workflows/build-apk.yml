# Workflow de GitHub Actions para compilar APK Android
# Updated: 2024-03-18 - Fixed system dependencies
name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Permitir ejecución manual

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias del sistema (minimal)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            cmake \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libgtk-3-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            autoconf \
            automake \
            build-essential \
            libssl-dev \
            libffi-dev \
            python3-dev \
            libtiff5-dev \
            zlib1g-dev \
            wget \
            openjdk-17-jdk \
            ant \
            libncurses5 \
            libncurses5-dev \
            libbz2-dev

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.5.0
          pip install Cython==0.29.37

      - name: Configurar Buildozer
        run: |
          # Asegurar que buildozer.spec tenga configuraciones correctas
          sed -i 's/^package.domain.*/package.domain = org.alandin123/' buildozer.spec
          sed -i 's/^version.*/version = 1.0.0/' buildozer.spec

      - name: Ejecutar Buildozer (Debug APK)
        run: |
          buildozer android debug
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANT_HOME: /usr/share/ant

      - name: Subir APK (Debug)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug
          path: bin/*.apk
          retention-days: 30

  build-release-apk:
    name: Build Release APK
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    needs: build-apk
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias del sistema (minimal)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            cmake \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libgtk-3-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            autoconf \
            automake \
            build-essential \
            libssl-dev \
            libffi-dev \
            python3-dev \
            libtiff5-dev \
            zlib1g-dev \
            wget \
            openjdk-17-jdk \
            ant \
            libncurses5 \
            libncurses5-dev \
            libbz2-dev

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.5.0
          pip install Cython==0.29.37

      - name: Crear keystore para release (solo para testing)
        run: |
          keytool -genkey -v -keystore release.keystore \
            -alias organizador \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Organizador, OU=Desarrollo, O=Organizador, L=Buenos Aires, ST=BA, C=AR"

      - name: Ejecutar Buildozer (Release APK)
        run: |
          buildozer android release
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANT_HOME: /usr/share/ant

      - name: Subir APK (Release)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-release
          path: bin/*-release.apk
          retention-days: 30

  test-python:
    name: Test Python Code
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar tests
        run: |
          python -m pytest tests/ -v --tb=short || true  # Continuar aunque fallen tests

  lint-python:
    name: Lint Python Code
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar linters
        run: |
          python -m pip install --upgrade pip
          pip install flake8 mypy black isort

      - name: Ejecutar flake8
        run: |
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics || true
          flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics || true

      - name: Ejecutar black (check only)
        run: |
          black --check src/ || true

      - name: Ejecutar isort (check only)
        run: |
          isort --check-only src/ || true
