# Configuración de Flake8 para el proyecto
[flake8]
max-line-length = 120
max-complexity = 15
exclude = 
    .git,
    __pycache__,
    build,
    dist,
    .eggs,
    venv,
    venv_buildozer,
    .venv,
    .buildozer,
    bin,
    src/mobile,
    src/cloud,
    src/core
ignore = 
    E203,  # Whitespace before ':'
    W503,  # Line break before binary operator
    F401,  # Imported but unused
    F403,  # Wildcard import
    E501,  # Line too long (handled by max-line-length)
